<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Flossy the tooth waving next to the word Flossophy">
  <style>
    .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 160px 260px; }
    .wave { animation: wave 2.4s ease-in-out infinite; transform-origin: 226px 166px; }
    .blink { animation: blink 4.5s infinite; transform-origin: 160px 140px; }
    .chip1 { animation: float 4s ease-in-out infinite; }
    .chip2 { animation: float 4s ease-in-out -2s infinite; }
    .spark { animation: twinkle 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    @keyframes wave { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-18deg) } 75% { transform: rotate(10deg) } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1) } 95% { transform: scaleY(0.1) } }
    @keyframes float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 1 } 50% { transform: scale(0.6); opacity: 0.6 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#17131f" opacity="0.1" /></pattern>
  </defs>

  <rect x="6" y="6" width="948" height="288" rx="28" fill="#17131f" />
  <rect x="0" y="0" width="948" height="288" rx="28" fill="#fbf8f3" stroke="#17131f" stroke-width="4" />
  <rect x="0" y="0" width="948" height="288" rx="28" fill="url(#dots)" />

  <!-- Flossy -->
  <g transform="translate(0 4)">
    <ellipse cx="160" cy="266" rx="60" ry="8" fill="#17131f" opacity="0.12" />
    <g class="bob">
      <g transform="translate(40 40)">
        <path d="M54 146 L32 166" stroke="#17131f" stroke-width="8" stroke-linecap="round" />
        <circle cx="29" cy="169" r="9" fill="#fff" stroke="#17131f" stroke-width="5" />
        <g class="wave" style="transform-origin: 186px 136px">
          <path d="M186 136 L212 104" stroke="#17131f" stroke-width="8" stroke-linecap="round" />
          <circle cx="215" cy="100" r="9" fill="#fff" stroke="#17131f" stroke-width="5" />
        </g>
        <path d="M120 52 C100 34 58 30 46 66 C38 92 46 118 54 146 C60 170 62 204 78 206 C94 208 96 178 102 162 C107 150 133 150 138 162 C144 178 146 208 162 206 C178 204 180 170 186 146 C194 118 202 92 194 66 C182 30 140 34 120 52 Z" fill="#fff" stroke="#17131f" stroke-width="7" stroke-linejoin="round" />
        <path d="M174 58 C190 76 186 108 180 136 C176 158 172 182 166 198 C176 190 178 168 182 148 C190 118 196 92 188 70 C185 64 180 60 174 58 Z" fill="#d6f2e9" />
        <path d="M66 68 C70 58 80 52 92 54" fill="none" stroke="#d6f2e9" stroke-width="7" stroke-linecap="round" />
        <g class="blink" style="transform-origin: 120px 108px">
          <circle cx="96" cy="108" r="11" fill="#17131f" /><circle cx="99.5" cy="104" r="3.6" fill="#fff" />
          <circle cx="144" cy="108" r="11" fill="#17131f" /><circle cx="147.5" cy="104" r="3.6" fill="#fff" />
        </g>
        <ellipse cx="78" cy="128" rx="10" ry="6" fill="#ff8fb1" opacity="0.75" />
        <ellipse cx="162" cy="128" rx="10" ry="6" fill="#ff8fb1" opacity="0.75" />
        <path d="M104 127 Q120 154 136 127 Q120 133 104 127 Z" fill="#17131f" stroke="#17131f" stroke-width="3" stroke-linejoin="round" />
        <path d="M113 139 Q120 150 127 139 Q120 135 113 139 Z" fill="#ff8fb1" />
      </g>
    </g>
  </g>
  <g transform="translate(278 64)"><path class="spark" d="M0 -10 C2 -2 2 -2 10 0 C2 2 2 2 0 10 C-2 2 -2 2 -10 0 C-2 -2 -2 -2 0 -10 Z" fill="#ffc93c" stroke="#17131f" stroke-width="2.5" /></g>
  <g transform="translate(52 84) scale(0.7)"><path class="spark" style="animation-delay: -1.1s" d="M0 -10 C2 -2 2 -2 10 0 C2 2 2 2 0 10 C-2 2 -2 2 -10 0 C-2 -2 -2 -2 0 -10 Z" fill="#ff8fb1" stroke="#17131f" stroke-width="2.5" /></g>

  <!-- Wordmark -->
  <text x="330" y="140" font-family="'Archivo Black', 'Arial Black', Impact, sans-serif" font-size="78" font-weight="900" fill="#17131f">Flossophy</text>
  <rect x="330" y="150" width="380" height="14" rx="7" fill="#22c7a0" opacity="0.75" />
  <text x="332" y="200" font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#4a4458">Book the dentist. Skip the drama.</text>

  <!-- Sticker chips -->
  <g class="chip1">
    <g transform="translate(738 52) rotate(-4)">
      <rect x="4" y="4" width="178" height="40" rx="12" fill="#17131f" />
      <rect width="178" height="40" rx="12" fill="#ffc93c" stroke="#17131f" stroke-width="3" />
      <text x="89" y="26" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#17131f">Vue · Koa · Mongo</text>
    </g>
  </g>
  <g class="chip2">
    <g transform="translate(764 214) rotate(5)">
      <rect x="4" y="4" width="128" height="40" rx="12" fill="#17131f" />
      <rect width="128" height="40" rx="12" fill="#ff8fb1" stroke="#17131f" stroke-width="3" />
      <text x="64" y="26" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#17131f">Booked!</text>
    </g>
  </g>
</svg>
